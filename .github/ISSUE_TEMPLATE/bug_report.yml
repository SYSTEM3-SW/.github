name: 버그 신고
description: 잘못된 동작을 알립니다
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 일어났나
      description: 실제로 일어난 동작을 적습니다
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 재현 방법
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 버전
      description: 라이브러리 버전 (예 1.1.1.3)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 로그나 화면 캡처
    validations:
      required: false
