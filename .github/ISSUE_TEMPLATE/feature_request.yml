name: 기능 요청
description: 새 기능이나 개선을 요청합니다
title: "feat: "
labels: ["feat"]
body:
  - type: textarea
    id: why
    attributes:
      label: 왜 필요한가
      description: 지금 무엇이 불편하거나 안 되는지 적습니다
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 원하는 동작
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 지금 쓰는 우회 방법이나 대안
    validations:
      required: false
